  <text x="90" y="46" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="800" fill="#0E1726">Usta<tspan fill="#1E6FFF">Desk</tspan></text>
  <text x="92" y="66" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#64748B">MASOFAVIY YORDAM</text>
