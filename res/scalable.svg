<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="2048" height="2048">
  <!-- UstaDesk app icon — geometry taken verbatim from logo.html -->
  <defs>
    <linearGradient id="gradIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E6FFF"/>
      <stop offset="100%" stop-color="#0B4FD1"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#gradIcon)"/>
  <!-- Monitor -->
  <rect x="30" y="34" width="60" height="42" rx="6" fill="none" stroke="#fff" stroke-width="5"/>
  <line x1="44" y1="86" x2="76" y2="86" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="76" x2="60" y2="86" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- Wrench (usta belgisi) -->
  <g transform="translate(74,60) rotate(45)">
    <rect x="0" y="0" width="22" height="7" rx="3.5" fill="#FFB020"/>
    <circle cx="-2" cy="3.5" r="6" fill="#FFB020"/>
    <circle cx="-2" cy="3.5" r="2.5" fill="#0B4FD1"/>
  </g>
</svg>
