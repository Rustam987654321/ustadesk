      <stop offset="0%" stop-color="#1E6FFF"/>
      <stop offset="100%" stop-color="#0B4FD1"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#gradH)"/>
    <rect x="17" y="20" width="36" height="26" rx="4" fill="none" stroke="#fff" stroke-width="3.2"/>
    <line x1="26" y1="52" x2="44" y2="52" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="35" y1="46" x2="35" y2="52" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
